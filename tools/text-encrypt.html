<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本加密工具</title>
    <style>
    html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        color: #333;
        font-weight: normal;
        margin-bottom: 30px;
        font-size: 24px;
    }

    .section {
        margin-bottom: 30px;
    }

    .section-title {
        font-size: 14px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
    }

    .key-mode {
        margin-bottom: 10px;
    }

    .key-mode label {
        margin-right: 20px;
        cursor: pointer;
        font-size: 14px;
    }

    .key-mode input[type="radio"] {
        margin-right: 5px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        font-family: monospace;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
        outline: none;
        border-color: #666;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    .auto-key-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
    }

    .auto-key-controls label {
        font-size: 14px;
    }

    .auto-key-controls input[type="number"] {
        width: 80px;
    }

    button {
        padding: 8px 16px;
        background-color: #00816a;
        color: white;
        border: none;
        font-size: 14px;
        cursor: pointer;
    }

    button:hover {
        background-color: #006654;
    }

    .error {
        color: #d32f2f;
        font-size: 12px;
        margin-top: 5px;
        display: none;
    }

    .error.show {
        display: block;
    }

    .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .action-buttons button {
        flex: 1;
    }

    .info {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
    }

    .copy-btn {
        margin-top: 10px;
    }
    </style>
</head>
<body>
    <h1>文本加密工具</h1>

    <!-- 密钥框 -->
    <div class="section">
        <span class="section-title">密钥设置</span>

        <div class="key-mode">
            <label>
                <input type="radio" name="keyMode" value="manual" checked>
                手动输入密钥
            </label>
            <label>
                <input type="radio" name="keyMode" value="auto">
                自动生成密钥
            </label>
        </div>

        <div id="manualKeyInput">
            <input type="text" id="manualKey" placeholder="请输入密钥（至少3个字符）">
            <div class="error" id="keyError">密钥长度至少需要3个字符</div>
        </div>

        <div id="autoKeyInput" style="display: none;">
            <div class="auto-key-controls">
                <label>密钥长度：</label>
                <input type="number" id="keyLength" min="3" max="32" value="16">
                <button onclick="generateKey()">生成密钥</button>
            </div>
            <input type="text" id="generatedKey" placeholder="生成的密钥将显示在这里" readonly style="margin-top: 10px;">
        </div>

        <div class="action-buttons">
            <button onclick="performEncrypt()">加密</button>
            <button onclick="performDecrypt()">解密</button>
        </div>
    </div>

    <!-- 输入框 -->
    <div class="section">
        <span class="section-title">输入文本</span>
        <textarea id="inputText" placeholder="请输入要加密的明文或要解密的密文"></textarea>
        <div class="error" id="inputError">请输入文本</div>
        <div class="info">加密时输入明文，解密时输入密文</div>
    </div>

    <!-- 输出框 -->
    <div class="section">
        <span class="section-title">输出结果</span>
        <textarea id="outputText" placeholder="加密或解密的结果将显示在这里" readonly></textarea>
        <div class="error" id="outputError">解密失败：密钥可能不正确或密文格式错误</div>
        <button class="copy-btn" onclick="copyOutput(event)">复制结果</button>
    </div>

    <script src="./static/crypto-js/crypto-js.min.js"></script>
    <script>
        // 切换密钥模式
        document.querySelectorAll('input[name="keyMode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'manual') {
                    document.getElementById('manualKeyInput').style.display = 'block';
                    document.getElementById('autoKeyInput').style.display = 'none';
                } else {
                    document.getElementById('manualKeyInput').style.display = 'none';
                    document.getElementById('autoKeyInput').style.display = 'block';
                }
            });
        });

        // 获取当前密钥
        function getCurrentKey() {
            const keyMode = document.querySelector('input[name="keyMode"]:checked').value;
            if (keyMode === 'manual') {
                return document.getElementById('manualKey').value;
            } else {
                return document.getElementById('generatedKey').value;
            }
        }

        // 验证密钥
        function validateKey(key) {
            return key && key.length >= 3;
        }

        // 生成随机密钥
        function generateKey() {
            const length = parseInt(document.getElementById('keyLength').value) || 16;
            const validLength = Math.min(Math.max(length, 3), 32);
            document.getElementById('keyLength').value = validLength;

            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            let key = '';
            for (let i = 0; i < validLength; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('generatedKey').value = key;
        }

        // AES加密
        function performEncrypt() {
            const key = getCurrentKey();
            const inputText = document.getElementById('inputText').value;
            const keyError = document.getElementById('keyError');
            const inputError = document.getElementById('inputError');
            const outputError = document.getElementById('outputError');

            // 清除之前的错误
            outputError.classList.remove('show');

            // 验证密钥
            if (!validateKey(key)) {
                keyError.classList.add('show');
                return;
            }
            keyError.classList.remove('show');

            // 验证输入
            if (!inputText) {
                inputError.classList.add('show');
                return;
            }
            inputError.classList.remove('show');

            try {
                // 使用 CryptoJS 进行 AES 加密
                const encrypted = CryptoJS.AES.encrypt(inputText, key).toString();
                document.getElementById('outputText').value = encrypted;
            } catch (error) {
                outputError.textContent = '加密失败: ' + error.message;
                outputError.classList.add('show');
            }
        }

        // AES解密
        function performDecrypt() {
            const key = getCurrentKey();
            const inputText = document.getElementById('inputText').value;
            const keyError = document.getElementById('keyError');
            const inputError = document.getElementById('inputError');
            const outputError = document.getElementById('outputError');

            // 清除之前的错误
            outputError.classList.remove('show');

            // 验证密钥
            if (!validateKey(key)) {
                keyError.classList.add('show');
                return;
            }
            keyError.classList.remove('show');

            // 验证输入
            if (!inputText) {
                inputError.classList.add('show');
                return;
            }
            inputError.classList.remove('show');

            try {
                // 使用 CryptoJS 进行 AES 解密
                const decrypted = CryptoJS.AES.decrypt(inputText, key);
                const plaintext = decrypted.toString(CryptoJS.enc.Utf8);

                if (!plaintext) {
                    outputError.textContent = '解密失败：密钥可能不正确或密文格式错误';
                    outputError.classList.add('show');
                    return;
                }

                document.getElementById('outputText').value = plaintext;
            } catch (error) {
                outputError.textContent = '解密失败: ' + error.message;
                outputError.classList.add('show');
            }
        }

        // 复制输出
        function copyOutput(event) {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                return;
            }

            // 使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputText.value).then(() => {
                    // 显示复制成功提示
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✓ 已复制';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    // 降级到旧方法
                    outputText.select();
                    document.execCommand('copy');
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✓ 已复制';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                });
            } else {
                // 降级到旧方法
                outputText.select();
                document.execCommand('copy');
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        }

        // 监听手动输入密钥的变化
        document.getElementById('manualKey').addEventListener('input', function() {
            const keyError = document.getElementById('keyError');
            if (this.value.length >= 3) {
                keyError.classList.remove('show');
            }
        });

        // 支持回车键快捷操作
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                performEncrypt();
            }
        });
    </script>
</body>
</html>
